version: '1.0'
name: voice-intercom-ci
displayName: Voice Intercom CI

triggers:
  trigger: auto
  push:
    branches:
      include:
        - master
        - main
        - develop

stages:
  # ----------------------------
  # 阶段1: 自动化测试
  # ----------------------------
  - stage:
    name: auto-test
    displayName: 自动化测试
    actions:
      - action:
        name: install-build-test
        displayName: 安装依赖并运行测试
        plugin:
          name: Shell
          version: 1.0.0
          param:
            command: |
              echo "=== 安装依赖 ==="
              apt-get update
              apt-get install -y cmake g++ qtbase5-dev libqt5network5 libspdlog-dev libyaml-cpp-dev nlohmann-json3-dev libopus-dev libssl-dev

              echo "=== CMake 配置 ==="
              mkdir -p build
              cd build
              cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DBUILD_SERVER=OFF -DBUILD_CLIENT=OFF

              echo "=== 构建 auto-test ==="
              make voice-auto-test -j$(nproc)

              echo "=== 运行测试 ==="
              ./bin/voice-auto-test -v1

  # ----------------------------
  # 阶段2: 服务端构建
  # ----------------------------
  - stage:
    name: server-build
    displayName: 服务端构建
    actions:
      - action:
        name: build-server
        displayName: 编译 SFU 服务端
        plugin:
          name: Shell
          version: 1.0.0
          param:
            command: |
              echo "=== 安装依赖 ==="
              apt-get update
              apt-get install -y cmake g++ qtbase5-dev libqt5network5 libspdlog-dev libyaml-cpp-dev nlohmann-json3-dev libopus-dev libssl-dev

              echo "=== 编译服务端 ==="
              mkdir -p build-server
              cd build-server
              cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_SERVER=ON -DBUILD_CLIENT=OFF
              make voice-sfu-server -j$(nproc)

              echo "=== 构建成功 ==="
              ls -la bin/

  # ----------------------------
  # 阶段3: 客户端构建
  # ----------------------------
  - stage:
    name: client-build
    displayName: 客户端构建
    actions:
      - action:
        name: build-client
        displayName: 编译客户端
        plugin:
          name: Shell
          version: 1.0.0
          param:
            command: |
              echo "=== 安装依赖 ==="
              apt-get update
              apt-get install -y cmake g++ qtbase5-dev libqt5network5 libspdlog-dev libyaml-cpp-dev nlohmann-json3-dev libopus-dev libssl-dev

              echo "=== 编译客户端 ==="
              mkdir -p build-client
              cd build-client
              cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_SERVER=OFF -DBUILD_CLIENT=ON
              make voice-client -j$(nproc)

              echo "=== 构建成功 ==="
              ls -la bin/
