name: CI Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qtbase5-dev libopus-dev libssl-dev

      - name: Configure CMake
        run: mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DBUILD_SERVER=OFF -DBUILD_CLIENT=OFF

      - name: Build auto-test
        run: cd build && make -j$(nproc) voice-auto-test

      - name: Run tests
        run: cd build && ./test/auto-test/voice-auto-test -v1

  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qtbase5-dev libyaml-cpp-dev libopus-dev libssl-dev

      - name: Configure CMake
        run: mkdir -p build-server && cd build-server && cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_SERVER=ON -DBUILD_CLIENT=OFF

      - name: Build server
        run: cd build-server && make -j$(nproc) voice-sfu-server

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: voice-sfu-server-linux
          path: build-server/bin/voice-sfu-server
          if-no-files-found: error

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qtbase5-dev libyaml-cpp-dev libopus-dev libssl-dev

      - name: Configure CMake
        run: mkdir -p build-client && cd build-client && cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_SERVER=OFF -DBUILD_CLIENT=ON

      - name: Build client
        run: cd build-client && make -j$(nproc) voice-client

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: voice-client-linux
          path: build-client/bin/voice-client
          if-no-files-found: error
