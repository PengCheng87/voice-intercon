version: '1.0'
name: master-pipeline
displayName: C++ CI Build
stages:
  - stage:
    name: compile
    displayName: 编译与测试
    steps:
      - step: build@maven
        name: build_and_test
        displayName: 编译并运行测试
        commands:
          - apt-get update -qq && apt-get install -y -qq cmake g++ qtbase5-dev 2>&1 | tail -5
          - apt-get install -y -qq libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev libopus-dev libssl-dev 2>&1 | tail -3 || echo "Optional packages unavailable, will use FetchContent"
          - mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DBUILD_SERVER=OFF -DBUILD_CLIENT=OFF 2>&1
          - cd build && make -j$(nproc 2>/dev/null || echo 4) voice-auto-test 2>&1
          - cd build && ./test/auto-test/voice-auto-test -v1
triggers:
  push:
    branches:
      include:
        - master
